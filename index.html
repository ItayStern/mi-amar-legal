<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מי אמר?</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #FFFBF5;
    color: #2A1F3D;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 420px; padding: 40px 24px; text-align: center; }
  h1 { color: #4B1FA8; font-size: 30px; margin-bottom: 4px; }
  p { color: #6E6283; margin-top: 0; }
  .links { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
  a.btn {
    display: block;
    background: #EEE7FD;
    color: #4B1FA8;
    font-weight: 700;
    text-decoration: none;
    padding: 14px;
    border-radius: 12px;
  }
  .en { margin-top: 28px; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>מי אמר?</h1>
    <p>משפט אחד. ארבע אפשרויות. מי אמר אותו?<br>מאת איתי שטרן ואריאל רוטנברג</p>
    <div class="links">
      <a class="btn" href="./support/">תמיכה</a>
      <a class="btn" href="./privacy/">מדיניות פרטיות</a>
    </div>
    <p class="en" dir="ltr">Mi Amar? (Who Said It?) — a Hebrew quote trivia game.
      <a href="./support/#en">Support</a> · <a href="./privacy/#en">Privacy Policy</a></p>
  </div>

</html>
